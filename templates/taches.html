{% extends "base.html" %}
{% block content %}
<h1>Mes tâches</h1>
<ul>
    {% for t in taches %}
    <li>
        <a href="/taches/{{ t.id }}">{{ t.id }} - {{ t.titre }}</a> 
        (<span class="{{ t.priorite }}">{{ t.priorite }}</span>) 
        {% if t.terminee %}O.K{% else %} K.O{% endif %}
     </li>
    {% endfor %}
</ul>
{% endblock %}
